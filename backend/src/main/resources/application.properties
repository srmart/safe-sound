spring.application.name=safe-and-sound-backend

# Usamos el puerto 54321 para evitar conflictos con PostgreSQL local de Windows
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
jwt.secret=dGVzdF9zZWNyZXRfa2V5X2Zvcl9qd3RfYXV0aGVudGljYXRpb25fc2FmZV9hbmRfc291bmQ


# Directorio privado para almacenar archivos
archivos.storage.path=${ARCHIVOS_STORAGE_PATH:./storage/archivos}

# Tamaño máximo permitido por archivo: 50 MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


